<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login por E-mail</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="container">
        <h1>Acesso por E-mail</h1>
        <p>Informe seu e-mail para receber um código de verificação.</p>

        <form action="/send-code" method="POST">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seuemail@gmail.com">

            <button type="submit">Enviar código</button>
        </form>
    </main>
</body>
</html>
